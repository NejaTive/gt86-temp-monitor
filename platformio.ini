; PlatformIO project for GT86 Temperature Monitor
; Board: ESP32 DevKit V1 (ESP32-WROOM-32)
; Framework: Arduino

; Default: real board profile, display driver off (TFT pins TBD in config.h)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DHW_PROFILE=0

; Wokwi extension profile: matches diagram.json (ILI9341 stand-in)
[env:esp32dev_wokwi_tft]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DHW_PROFILE=1
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ILI9341
  adafruit/Adafruit BusIO
