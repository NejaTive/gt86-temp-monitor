; PlatformIO project for GT86 Temperature Monitor
; Board: ESP32 DevKit V1 (ESP32-WROOM-32)
; Framework: Arduino

; Real board: ST7789V 1.54" (agreed pinout in config.h), no pot
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DHW_PROFILE=0
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit BusIO

; Wokwi extension profile: matches diagram.json (ILI9341 stand-in)
[env:esp32dev_wokwi_tft]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DHW_PROFILE=1
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ILI9341
  adafruit/Adafruit BusIO
